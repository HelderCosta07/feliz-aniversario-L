<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Aniversário!</title>
    <!-- Biblioteca de Confetes via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Fontes do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #fce4ec, #f8bbd0, #e1bee7);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            padding: 20px;
        }
        .card-container {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            max-width: 450px;
            width: 100%;
            padding: 35px 25px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        .card-container:hover {
            transform: translateY(-5px);
        }
        .profile-wrapper {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 20px auto;
        }
        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #ec407a;
            box-shadow: 0 8px 20px rgba(236, 64, 122, 0.3);
            transition: transform 0.5s ease;
        }
        .profile-wrapper:hover .profile-img {
            transform: scale(1.05) rotate(3deg);
        }
        .badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: #ab47bc;
            color: #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.8rem;
            color: #d81b60;
            margin-bottom: 10px;
            line-height: 1.2;
        }
        .subtitle {
            font-size: 0.95rem;
            color: #78909c;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }
        .message-box {
            background: #fcf4f8;
            border-left: 4px solid #ec407a;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 25px;
            text-align: left;
            color: #4a4a4a;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .btn-surprise {
            background: linear-gradient(45deg, #ec407a, #ab47bc);
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(236, 64, 122, 0.4);
            transition: all 0.3s ease;
            outline: none;
        }
        .btn-surprise:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(236, 64, 122, 0.6);
        }
        .btn-surprise:active {
            transform: scale(0.98);
        }
        .hidden-message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #f3e5f5;
            border-radius: 12px;
            color: #6a1b9a;
            font-weight: 600;
            animation: fadeIn 0.8s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="profile-wrapper">
            <!-- Substitua 'sua-foto.jpg' pelo caminho da foto dela -->
            <img src="sua-foto.jpg" alt="Foto Aniversariante" class="profile-img">
            <div class="badge">✨</div>
        </div>

        <h1>Feliz Aniversário Letícia!</h1>
        <p class="subtitle">Hoje o dia é todo seu 🎉</p>

        <div class="message-box">
            Que o seu novo ano seja repleto de sorrisos, conquistas, momentos inesquecíveis e muita saúde!
        </div>

        <button class="btn-surprise" onclick="celebrate()">Aperte para Celebrar! 🎈</button>

        <div id="hiddenMsg" class="hidden-message">
            💖 Você merece um ano maravilhoso e inesquecível! Aproveite muito o seu dia!🎉
                  "um abraço e um beijão do seu gatinho Gustavo💖💖"
        </div>
    </div>

    <script>
        // Dispara confetes automaticamente ao abrir a página
        window.addEventListener('DOMContentLoaded', () => {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        });

        function celebrate() {
            // Efeito contínuo de confetes ao clicar no botão
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
              return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();

              if (timeLeft <= 0) {
                return clearInterval(interval);
              }

              var particleCount = 50 * (timeLeft / duration);
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);

            // Revela a mensagem especial extra
            document.getElementById('hiddenMsg').style.display = 'block';
        }
    </script>
</body>
</html>
